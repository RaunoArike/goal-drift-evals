[project]
name = "goal-drift-evaluations"
version = "0.1.0"
description = "Goal drift evaluations for LLM agents"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "openai>=1.52.0",
    "numpy>=2.1.2",
    "scipy>=1.14.1",
    "matplotlib>=3.9.2",
    "pydantic>=2.9.2",
    "jsonschema>=4.23.0",
    "tiktoken>=0.8.0",
    "tokenizers>=0.20.1",
    "ipython>=8.29.0",
    "ipykernel>=6.29.5",
    "requests>=2.32.3",
    "tqdm>=4.66.5",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pip-tools>=7.4.1",
]
